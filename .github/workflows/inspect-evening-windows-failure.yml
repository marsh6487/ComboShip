name: Inspect evening Windows compiler failure
on:
  push:
    branches: [diagnostics/evening-windows-20261025]
permissions:
  actions: read
  checks: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract compiler errors from the existing failed job
        uses: actions/github-script@v7
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        with:
          script: |
            const jobId = 121084840190;
            const endpoint = `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/jobs/${jobId}/logs`;
            const response = await fetch(endpoint, {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_READ_TOKEN}`,
                Accept: 'application/vnd.github+json'
              },
              redirect: 'manual'
            });
            let text;
            if (response.status === 302) {
              const location = response.headers.get('location');
              if (!location) throw new Error('Missing job-log redirect');
              const download = await fetch(location);
              if (!download.ok) throw new Error(`Job-log transfer HTTP ${download.status}`);
              text = await download.text();
            } else if (response.ok) {
              text = await response.text();
            } else {
              throw new Error(`Job-log API HTTP ${response.status}: ${await response.text()}`);
            }
            const lines = text.split('\n');
            const errors = lines.filter(line => /\b(?:fatal\s+)?error(?:\s+(?:C|LNK|MSB)\d+|\s*:)/i.test(line));
            core.info(`Read ${lines.length} log lines; found ${errors.length} compiler/build error lines.`);
            for (const line of errors.slice(-80)) core.info(line);
            if (!errors.length) for (const line of lines.slice(-80)) core.info(line);
            await core.summary.addHeading('Existing failed Windows job: compiler excerpt')
              .addCodeBlock((errors.length ? errors : lines.slice(-80)).slice(-80).join('\n')).write();
