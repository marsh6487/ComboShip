name: Import accepted NEI assets once
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/nei-gi-combined-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Import the pinned accepted SoH package into this candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ae2da508b60bedbde117432a6ce13ff0ab1a22dc
          git remote add nei-donor https://github.com/marsh6487/Shipwright.git
          git fetch --no-tags --depth=1 nei-donor 628deea3cf851af19a18f915e0665d772294c383 2ce2e5a28098261943c25f8a1ecebe730c1d06ea
          git diff --binary 628deea3cf851af19a18f915e0665d772294c383 2ce2e5a28098261943c25f8a1ecebe730c1d06ea -- soh tests tools scripts/diagnostics/run_nei_gi_tests.py scripts/diagnostics/run_hint_item_name_tests.py scripts/diagnostics/run_switch_hook_instant_tests.py scripts/diagnostics/run_time_gate_visibility_tests.py > "$RUNNER_TEMP/nei-import.patch"
          git apply --3way --index "$RUNNER_TEMP/nei-import.patch"
          git config user.name comboship-bot
          git config user.email comboship-bot@users.noreply.github.com
          git commit -m "Port accepted SoH NEI package from 2ce2e5a2"
          git push origin HEAD:refs/heads/feat/nei-gi-combined-20260929
