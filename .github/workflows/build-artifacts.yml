name: Build Artifacts

# Single PR gate + nightly build workflow. `gate` (conflict markers, asset collisions,
# clang-format) runs on every PR; `windows`/`linux` run the reusable build pipelines only when
# code paths changed, and only after gate passes. Keep the FILE NAME: validate-seed.yml selects
# develop runs with `gh run list --workflow build-artifacts.yml`. See docs/UPSTREAM_MERGES.md.

on:
  pull_request:
  push:
    branches: [develop]
    paths:
      - 'libultraship/**'
      - 'soh/**'
      - 'mm/**'
      - 'combo/**'
      - 'CMakeLists.txt'
      - 'CMake/**'
      - 'OTRExporter/**'
      - 'ZAPDTR/**'
      - 'scripts/linux/**'
      # A build input (CMakeLists.txt reads it for the version/save gate), and it keeps the gate from
      # skipping an upstream-merge PR whose diff is only the pin bump + merge log.
      - 'upstream-pins.json'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/build-artifacts.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a develop push mid-flight: the Linux ccache only saves on push, and validate-seed
  # depends on develop producing a successful run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - name: Scan for conflict markers
        shell: bash
        run: |
          set -uo pipefail
          # {7,} not {7}: rename/path conflicts emit 8-char markers ("<<<<<<<< HEAD:path") — the exact
          # form of the mm-asset splices that slipped past this gate in #50 and 2026-07-13.
          pattern='^(<{7,}|>{7,}|\|{7,})( |$)'
          hits=$(git grep -nE "$pattern" -- . ':(exclude).github/workflows/build-artifacts.yml' || true)

          if [ -z "$hits" ]; then
            echo "✅ No unresolved conflict markers." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          count=$(printf '%s\n' "$hits" | wc -l | tr -d ' ')
          {
            echo "## ⛔ Unresolved merge-conflict markers ($count)"
            echo ""
            echo "This PR has committed conflict markers and **must not be merged** until they are resolved."
            echo "GitHub's \"ready to merge\" / \"no conflicts\" is misleading here — the markers are plain text"
            echo "inside the files, not a git-level conflict. Resolve them on the source branch, then this"
            echo "check goes green."
            echo ""
            echo '```'
            printf '%s\n' "$hits"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=: read -r file line _; do
            [ -n "$file" ] && echo "::error file=${file},line=${line}::Unresolved merge-conflict marker — resolve before merging"
          done <<< "$hits"

          echo "::error::Found $count conflict-marker line(s). See annotations and the job summary."
          exit 1

      - name: Check custom asset trees for new path collisions
        run: python3 scripts/check-asset-collisions.py

      - name: clang-format (clang-format-14)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-14 nlohmann-json3-dev libspdlog-dev libsdl2-dev libogg-dev libvorbis-dev pkg-config python3-numpy python3-pil
          ./run-clang-format.sh
          git diff --exit-code

      - name: PAK menu visibility and voice discovery
        run: |
          python3 scripts/diagnostics/run_combo_pak_visibility_tests.py
          python3 scripts/diagnostics/run_voice_pack_discovery_tests.py

      - name: Shared-item integration regressions
        run: |
          python3 scripts/diagnostics/run_combo_shared_test.py --json-include /usr/include
          python3 scripts/diagnostics/run_combo_grant_tests.py --json-include /usr/include
          python3 tests/dungeon_rewards/run_tests.py --json-include /usr/include
          python3 tests/item_grant_audit/run_tests.py
          python3 scripts/diagnostics/run_combo_reward_delivery_tests.py
          python3 scripts/diagnostics/run_combo_reward_delivery_tests.py --sanitize

      - name: Accepted NEI presentation and MM pickup regressions
        run: |
          # Fixed source fixtures from the accepted SoH history; never substitute current output.
          git fetch --no-tags --depth=1 https://github.com/marsh6487/Shipwright.git cec63fce86b1f582f6e61ad6a98eca6c3cca784b c77c18587a976f6d6cb5c8f91f27593286469218
          # HD icon routes compare grant behavior with this fixed ComboShip baseline.
          git fetch --no-tags --depth=1 origin 122dd5f68cb37fcf515c3726f8a77043db5dcdf4
          # Match libultraship's ImGui dependency for the real save-editor draw fixture.
          git clone --depth=1 --branch v1.91.9b-docking https://github.com/ocornut/imgui.git "$RUNNER_TEMP/combo-nei-imgui"
          # The real SaveEditor headers also reach ResourceManager and GuiTexture.
          # Use the same pins as libultraship/cmake/dependencies/common.cmake.
          git clone --depth=1 --branch v4.1.0 https://github.com/bshoshany/thread-pool.git "$RUNNER_TEMP/combo-nei-thread-pool"
          mkdir -p "$RUNNER_TEMP/combo-nei-stb"
          curl --fail --location https://raw.githubusercontent.com/nothings/stb/0bc88af4de5fb022db643c2d8e549a0927749354/stb_image.h --output "$RUNNER_TEMP/combo-nei-stb/stb_image.h"
          CPATH="$RUNNER_TEMP/combo-nei-imgui:$RUNNER_TEMP/combo-nei-thread-pool/include:$RUNNER_TEMP/combo-nei-stb${CPATH:+:$CPATH}" bash scripts/diagnostics/run_combo_nei_regressions.sh

      - name: OoT diagnostic frame timing accounting
        run: |
          python3 scripts/diagnostics/run_build_metadata_test.py
          python3 scripts/diagnostics/run_frame_timing_probe_tests.py

      - name: Progressive Din swords and Mario cap sound lifetimes
        run: |
          python3 -B scripts/diagnostics/run_din_fire_sword_tests.py
          python3 -B scripts/diagnostics/run_din_progressive_hand_tests.py
          python3 -B scripts/diagnostics/run_din_fire_sword_damage_tests.py
          python3 -B scripts/diagnostics/run_mm_din_fire_tests.py
          python3 -B scripts/diagnostics/run_mm_din_fire_damage_tests.py
          python3 -B tests/sm64_caps/run_audio_tests.py
          python3 -B tests/oot_timegate/run_audio_tests.py

      - name: Contents-based chests and opt-in Midna
        run: |
          python3 scripts/diagnostics/run_chest_size_tests.py
          python3 scripts/diagnostics/run_mm_chest_contents_tests.py
          python3 scripts/diagnostics/run_midna_navi_draw_test.py
          python3 scripts/diagnostics/run_midna_audio_test.py
          python3 scripts/diagnostics/run_mm_midna_test.py

      - name: 2Ship weather, item-color, scene-randomization and streamed-audio regressions
        run: |
          python3 scripts/diagnostics/run_mm_scene_randomization_tests.py
          python3 scripts/diagnostics/run_mm_audio_runtime_test.py "$RUNNER_TEMP/mm-audio-runtime"
          python3 scripts/diagnostics/run_mm_audio_decoder_tests.py
          python3 scripts/diagnostics/run_mm_streamed_positional_tests.py --sanitize
          python3 scripts/diagnostics/run_mm_audio_pcm_tests.py
          MM_AUDIO_PCM_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -fno-pie -no-pie" python3 scripts/diagnostics/run_mm_audio_pcm_tests.py
          python3 scripts/diagnostics/run_native_audio_mixer_tests.py
          python3 tests/audio_mixer/run_pcm_diagnostics_tests.py
          NATIVE_AUDIO_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -fno-pie -no-pie" python3 scripts/diagnostics/run_native_audio_mixer_tests.py
          python3 scripts/diagnostics/run_mm_audio_worker_tests.py
          MM_AUDIO_WORKER_CXXFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -fno-pie -no-pie" python3 scripts/diagnostics/run_mm_audio_worker_tests.py
          python3 scripts/diagnostics/run_mm_weather_tests.py
          python3 scripts/diagnostics/run_mm_custom_item_color_tests.py
          python3 scripts/diagnostics/run_mm_hud_cosmetics_tests.py
          python3 scripts/diagnostics/run_mm_drop_lifetime_tests.py
          python3 scripts/diagnostics/run_mm_unrestricted_items_tests.py
          python3 scripts/diagnostics/run_mm_item_visuals_tests.py
          python3 scripts/diagnostics/run_mm_dungeon_key_tests.py
          python3 scripts/diagnostics/run_mm_dungeon_key_tests.py --sanitize
          python3 scripts/diagnostics/run_mm_gfx_patch_tests.py

      - name: Foreign soul replacement skeletons and limb matrices
        run: |
          python3 -B scripts/diagnostics/run_foreign_soul_skeleton_tests.py
          python3 -B scripts/diagnostics/run_foreign_soul_skeleton_tests.py --sanitize
          python3 -B scripts/diagnostics/run_boss_soul_model_tests.py
          python3 -B scripts/diagnostics/run_boss_soul_model_tests.py --sanitize
          python3 -B scripts/diagnostics/run_barinade_syntax_tests.py
          python3 -B scripts/diagnostics/run_twinrova_gi_replacement_tests.py
          python3 -B scripts/diagnostics/run_twinrova_gi_replacement_tests.py --sanitize
          python3 -B scripts/diagnostics/run_mm_oot_boss_import_bridge_tests.py
          python3 -B scripts/diagnostics/run_mm_oot_boss_import_bridge_tests.py --sanitize

      - name: Static OoT equipment GI bridge
        run: |
          python3 -B scripts/diagnostics/run_mm_static_gi_bridge_tests.py
          python3 -B scripts/diagnostics/run_mm_static_gi_bridge_tests.py --sanitize

      - name: Foreign OoT magic jar cosmetic presentation
        run: |
          python3 -B scripts/diagnostics/run_foreign_magic_jar_tests.py
          ASAN_OPTIONS=detect_leaks=0 python3 -B scripts/diagnostics/run_foreign_magic_jar_tests.py --sanitize

      - name: Foreign OoT key and heart cosmetics
        run: |
          python3 -B scripts/diagnostics/run_oot_key_cosmetic_bridge_tests.py
          ASAN_OPTIONS=detect_leaks=0 python3 -B scripts/diagnostics/run_oot_key_cosmetic_bridge_tests.py --sanitize
          python3 -B scripts/diagnostics/run_foreign_heart_cosmetic_tests.py
          ASAN_OPTIONS=detect_leaks=0 python3 -B scripts/diagnostics/run_foreign_heart_cosmetic_tests.py --sanitize

      - name: Great Spin GI presentation in both engines
        run: |
          python3 -B scripts/diagnostics/run_spin_gi_tests.py
          python3 -B scripts/diagnostics/run_spin_gi_tests.py --sanitize

      - name: Mask and remains shimmer in both engines
        run: |
          python3 -B scripts/diagnostics/run_mask_shimmer_tests.py
          python3 -B scripts/diagnostics/run_mask_shimmer_tests.py --sanitize

      - name: 2Ship mod GUI fonts
        run: python3 scripts/diagnostics/run_mm_mod_font_tests.py

      - name: Complete render flight recorder coverage
        run: |
          python3 scripts/diagnostics/run_performance_trace_tests.py
          python3 scripts/diagnostics/run_draw_attribution_tests.py "$RUNNER_TEMP/draw-attribution"
          python3 libultraship/tests/gpu_timing_query_test.py /usr/include
          python3 libultraship/tests/dxgi_pacing_test.py /usr/include
          python3 scripts/diagnostics/test_analyze_render_flight.py

      - name: OoT triangle submission equivalence
        run: |
          python3 scripts/diagnostics/run_gfx_triangle_run_tests.py
          GFX_TRIANGLE_TEST_CXXFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' python3 scripts/diagnostics/run_gfx_triangle_run_tests.py

      - name: Shared renderer texture-address regressions
        run: |
          git apply --check --directory=libultraship patches/libultraship-custom-tex-scroll-e3cd6591.patch
          python3 scripts/diagnostics/test_custom_scroll_runtime.py
          GFX_TEXTURE_TEST_CXXFLAGS='-fsanitize=address,undefined -fno-sanitize-recover=all -g -fno-omit-frame-pointer' python3 scripts/diagnostics/run_gfx_texture_address_tests.py
          python3 scripts/diagnostics/run_gfx_texture_address_tests.py --low-module
          python3 scripts/diagnostics/run_texture_failure_command_tests.py --sanitize
          GFX_DL_TEST_CXXFLAGS='-fsanitize=address,undefined -fno-sanitize-recover=all -g -fno-omit-frame-pointer' python3 scripts/diagnostics/run_gfx_display_list_address_tests.py
          python3 scripts/diagnostics/run_alt_segment_binding_tests.py
          python3 -B scripts/diagnostics/run_carpet_segment_restore_tests.py

      - name: Vertex lighting and texture generation equivalence
        run: |
          git fetch --no-tags --depth=1 origin 9c084d74a7f7d0ae8cf88b18c0ed74abde03a950
          python3 scripts/diagnostics/run_gfx_vertex_batch_tests.py
          GFX_VERTEX_TEST_CXXFLAGS='-O1 -g -fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=all -fno-omit-frame-pointer' python3 scripts/diagnostics/run_gfx_vertex_batch_tests.py --skip-null-test

      - name: 2Ship back equipment and OoT sky compatibility
        run: |
          python3 scripts/diagnostics/run_mm_back_equipment_tests.py
          python3 scripts/diagnostics/run_mm_oot_sky_tests.py

      - name: OoT transformation cosmetics and Zora barrier regressions
        run: |
          python3 scripts/diagnostics/run_oot_custom_cosmetics_tests.py
          python3 scripts/diagnostics/run_zora_barrier_cosmetics_tests.py

      - name: Young Epona riding and independent Epona cosmetics
        run: |
          python3 scripts/diagnostics/run_young_epona_tests.py
          python3 scripts/diagnostics/run_young_epona_actor_tests.py
          python3 scripts/diagnostics/run_young_epona_player_tests.py
          python3 scripts/diagnostics/run_young_epona_save_tests.py
          python3 scripts/diagnostics/test_young_epona_assets.py
          python3 scripts/diagnostics/run_epona_mask_tests.py
          python3 scripts/diagnostics/run_epona_cosmetics_tests.py
          python3 scripts/diagnostics/run_mm_epona_cosmetics_tests.py

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'libultraship/**'
              - 'soh/**'
              - 'mm/**'
              - 'combo/**'
              - 'CMakeLists.txt'
              - 'CMake/**'
              - 'OTRExporter/**'
              - 'ZAPDTR/**'
              - 'scripts/linux/**'
              - 'upstream-pins.json'
              - '.github/workflows/build.yml'
              - '.github/workflows/build-linux.yml'
              - '.github/workflows/build-artifacts.yml'

  windows:
    needs: gate
    if: needs.gate.outputs.code == 'true'
    uses: ./.github/workflows/build.yml
    with:
      # Only develop's validator artifact is ever consumed (validate-seed.yml fetches the latest
      # successful develop run), so PRs skip building and uploading it.
      validator: ${{ github.ref == 'refs/heads/develop' }}

  linux:
    needs: gate
    if: needs.gate.outputs.code == 'true'
    uses: ./.github/workflows/build-linux.yml
