name: Build (Linux)

# Reusable Linux build pipeline: full Release build (Ninja + gcc), port o2r generation, and a
# headless comborando seed-generation smoke test — the same end-to-end check used to validate the
# port locally (the fill runs both games' oracles in-process, so it exercises the ELF combo ABI
# without ROMs). Produces a runnable ComboShip-linux artifact (users add their own extracted
# oot.o2r/mm.o2r) plus a self-contained ComboShip-linux-appimage — the plain tree links against
# the runner's system libraries, so on other distros it needs a matching ABI (see
# docs/BUILDING_LINUX.md); the AppImage bundles them. Called by build-artifacts.yml
# (preflight first, final gate after all jobs) and release.yml (v* tags).

on:
  workflow_call:

jobs:
  build:
    # 24.04, not 22.04: the port is developed and tested against noble's apt packages (SDL 2.30.x,
    # tinyxml2 10.0), which are new enough that upstream 2ship's source-built SDL/tinyxml2 steps
    # (a jammy workaround) aren't needed here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Upstream 2ship's apt-deps.txt set, plus libzip + tools for the ZAPD/o2r pipeline.
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          # Avoid kernel.org mirror stalls; use the working MIT Ubuntu mirror.
          # APT retains its normal signature checks.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libusb-dev libusb-1.0-0-dev libsdl2-dev libsdl2-net-dev libpng-dev libglew-dev \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev ninja-build \
            libogg-dev libopus-dev opus-tools libopusfile-dev libvorbis-dev \
            libzip-dev zipcmp zipmerge ziptool gdb

      # ~2600 objects across lus/soh/2ship/combo: ccache is the difference between ~90 min cold
      # and a few minutes warm. In-repository PRs can warm their own scoped cache;
      # fork PRs remain read-only. Successful develop builds seed future branches.
      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          save: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          key: ${{ runner.os }}-linux-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-linux-ccache-${{ github.ref }}
            ${{ runner.os }}-linux-ccache

      # Python3: Generate2ShipOtr (OTRExporter/extract_assets.py) and the asset-collision gate. soh packs
      # with Torch (soh-o2r-packer), whose configure step fetches tinyxml2/zlib/yaml-cpp (needs network).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify all bundled emotes and shared playback
        run: python3 -B tests/emotes/run_tests.py

      - name: Verify shared progression with relaxed OoT logic
        run: >
          python3 -B tests/shared_progression_logic/run_tests.py
          --output-dir "$RUNNER_TEMP/shared-progression-unit"

      - name: Verify native settings sweep verdicts
        run: python3 -B tests/shared_progression_logic/native_sweep.py --self-test

      - name: Verify saved native entrance reload
        run: python3 -B scripts/diagnostics/run_cross_dungeon_reload_test.py

      - name: Configure
        run: >
          cmake -B build-cmake -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Same order as the Windows pipeline: libultraship -> soh (Torch) -> 2ship (OTRExporter/ZAPD),
      # then the combo targets. -j 4 caps peak memory: some soh/2ship TUs are
      # >1 GB each at peak, and the 16 GB standard runner OOMs before Ninja's default parallelism
      # helps (locally 20 jobs OOM'd a 21 GB machine).
      - name: Build libultraship
        run: cmake --build build-cmake --target libultraship -j 4
      - name: Build soh
        run: cmake --build build-cmake --target soh -j 4
      - name: Build 2ship
        run: cmake --build build-cmake --target 2ship -j 4
      - name: Build comborando
        run: cmake --build build-cmake --target comborando -j 4
      - name: Build comboui
        run: cmake --build build-cmake --target comboui -j 4
      - name: Build ComboShip
        run: cmake --build build-cmake --target ComboShip -j 4

      # Port asset archives (--norom), same as the Windows job.
      - name: Generate soh.o2r
        run: cmake --build build-cmake --target GenerateSohOtr -j 4
      - name: Generate 2ship.o2r
        run: cmake --build build-cmake --target Generate2ShipOtr -j 4

      # End-to-end smoke: generate + validate one cross-world seed with both games' logic oracles
      # loaded in-process. Catches symbol-interposition and combo-ABI regressions that compiling
      # can't. Runs from the deploy dir because the tool dlopens ./libsoh.so & ./lib2ship.so.
      # Fixed seed keeps failures reproducible; exit code is the verdict (0 = beatable).
      - name: Smoke-test seed generation (comborando)
        working-directory: build-cmake/combo
        run: python3 ../../scripts/ci/run_seed_smoke.py ./comborando --seed ci-linux-smoke --count 1

      - name: Smoke-test door-only cross-game entrance generation
        working-directory: build-cmake/combo
        timeout-minutes: 10
        run: >
          ./comborando --seed ci-door-interiors --count 1
          --cross-dungeon-entrances=0 --cross-boss-entrances=0
          --cross-interior-entrances=0 --cross-grotto-entrances=0
          --cross-shop-entrances=1 --cross-door-interior-entrances=1

      # Save the built validator/runtime before distribution packaging. A linuxdeploy
      # download or AppImage failure must not discard a fully linked native build.
      - name: Stage native Linux runtime
        id: native_runtime
        run: ./scripts/linux/make-appimage.sh build-cmake _packages --stage-only

      - name: Upload ComboShip-linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComboShip-linux
          path: _packages/stage
          if-no-files-found: error

      - name: Verify actual native Solo MM entrance generation and replay
        if: ${{ !cancelled() && steps.native_runtime.outcome == 'success' }}
        timeout-minutes: 15
        run: >
          python3 -B tests/solo_mm_entrances/native_seed_regression.py
          --runtime-dir "$PWD/_packages/stage"
          --output "$RUNNER_TEMP/native-solo-mm-entrances"
          --case off --case mixed-decoupled --seed 20261110

      - name: Preserve native Solo MM entrance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-solo-mm-entrances-linux
          path: |
            ${{ runner.temp }}/native-solo-mm-entrances
            !${{ runner.temp }}/native-solo-mm-entrances/**/runtime/**
          if-no-files-found: warn

      - name: Verify actual native first-drop graph, fill and replay (Vanilla)
        if: ${{ !cancelled() && steps.native_runtime.outcome == 'success' }}
        timeout-minutes: 90
        run: >
          python3 -B tests/shuffle_parity/enemy_drops/native_seed_regression.py
          --runtime-dir "$PWD/_packages/stage"
          --driver "$PWD/_packages/stage/comborando"
          --output "$RUNNER_TEMP/native-first-drops"
          --case vanilla-off --case vanilla-on --case vanilla-on-excluded

      - name: Preserve native seed evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-first-drops-linux
          path: |
            ${{ runner.temp }}/native-first-drops
            !${{ runner.temp }}/native-first-drops/runtime/**
          if-no-files-found: warn

      - name: Verify actual native both-solo and combined parity seeds
        if: ${{ !cancelled() && steps.native_runtime.outcome == 'success' }}
        timeout-minutes: 120
        run: >
          python3 -B tests/shuffle_parity/boss_keys/native_boss_key_regression.py
          --runtime-dir "$PWD/_packages/stage"
          --driver "$PWD/_packages/stage/comborando"
          --output "$RUNNER_TEMP/native-boss-keys"

      - name: Preserve native parity seed evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-boss-keys-linux
          path: |
            ${{ runner.temp }}/native-boss-keys
            !${{ runner.temp }}/native-boss-keys/runtime/**
          if-no-files-found: warn

      - name: Sweep native combined seed settings
        if: ${{ !cancelled() && steps.native_runtime.outcome == 'success' }}
        timeout-minutes: 45
        run: >
          python3 -B tests/shared_progression_logic/native_sweep.py
          --runtime-dir "$PWD/_packages/stage"
          --driver "$PWD/_packages/stage/comborando"
          --output "$RUNNER_TEMP/native-shared-progression"
          --jobs 3 --timeout 300

      - name: Preserve shared progression regression evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-shared-progression-linux
          path: |
            ${{ runner.temp }}/shared-progression-unit
            ${{ runner.temp }}/native-shared-progression
            !${{ runner.temp }}/native-shared-progression/**/runtime/**
          if-no-files-found: warn

      # Stages the runnable tree (binaries + assets + port o2rs; game archives oot.o2r / mm.o2r
      # are ROM-extracted by the user and never built or shipped here) and packages it as a
      # self-contained AppImage — linuxdeploy bundles the system .so deps and combo/linux/AppRun
      # recreates the launcher's portable cwd layout in a writable data dir at run time.
      - name: Stage Linux package + build AppImage
        shell: bash
        run: ./scripts/linux/make-appimage.sh build-cmake _packages 2>&1 | tee "$RUNNER_TEMP/linux-packaging.log"

      - name: Preserve packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packaging-log
          path: ${{ runner.temp }}/linux-packaging.log
          if-no-files-found: warn

      # GitHub zips artifact contents on download, which drops the exec bit — the docs tell users
      # to chmod +x the AppImage after unzipping (standard for CI-distributed AppImages).
      - name: Upload ComboShip-linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ComboShip-linux-appimage
          path: _packages/ComboShip-*-linux-x86_64.AppImage
          if-no-files-found: error
